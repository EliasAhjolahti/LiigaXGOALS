<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liiga xG tänään</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c232c; --line:#2a323d; --text:#e8edf2; --muted:#8b97a5;
  --home:#d6293a; --away:#2aa7e0; --goal:#ffd34d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
h2{font:600 22px 'Barlow Condensed',sans-serif;letter-spacing:.04em;text-transform:uppercase;margin:0 0 12px;color:#fff}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Scoreboard */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center}
.team img{width:84px;height:84px;object-fit:contain}
.team .nm{font:700 28px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.03em}
.big{font:700 64px/1 'Barlow Condensed',sans-serif}
.status{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:99px;background:var(--panel2);font-size:12px;color:var(--muted)}
.status.live{background:#3b0d12;color:#ff6b78}
.xgrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin-top:18px}
.xgval{font:700 40px 'Barlow Condensed',sans-serif}
.xglbl{font:600 13px 'Barlow Condensed';letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--panel2);margin-top:10px}
.bar div{height:100%}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}.big{font-size:48px}.team img{width:56px;height:56px}.team .nm{font-size:20px}}

/* Team stats compare */
.cmp{display:grid;grid-template-columns:60px 1fr 60px;align-items:center;gap:8px;margin:9px 0}
.cmp .l{text-align:left;font-weight:600}.cmp .r{text-align:right;font-weight:600}
.cmp .mid{text-align:center;font-size:12px;color:var(--muted)}
.cmp .mini{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--panel2);margin-top:4px}

table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;text-align:right;white-space:nowrap}
th{font:600 12px 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
th:first-child,td:first-child,th.left,td.left{text-align:left}
tbody tr{border-bottom:1px solid #1f262f}
tbody tr:hover{background:var(--panel2)}
th.sorted{color:#fff}
.tablewrap{overflow-x:auto}

/* Leaders */
.leaders{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:var(--panel2);border-radius:12px;overflow:hidden;border-top:4px solid var(--c);position:relative}
.card .ph{height:150px;background:linear-gradient(180deg,#2a323d,#1c232c);display:flex;align-items:flex-end;justify-content:center}
.card .ph img{height:100%;object-fit:cover}
.card .jn{position:absolute;top:8px;left:10px;font:700 26px 'Barlow Condensed';color:var(--c);opacity:.9}
.card .bd{padding:10px 12px}
.card .pn{font:700 18px/1.1 'Barlow Condensed';text-transform:uppercase}
.card .xg{font:700 30px 'Barlow Condensed';color:var(--c)}
.card .sub{font-size:12px;color:var(--muted)}

.av{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:top;background:var(--panel2);vertical-align:middle;margin-right:8px}
.pl{display:flex;align-items:center}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;font:600 14px Inter}
.tabs button.on{background:var(--c);border-color:var(--c);color:#0d1117}
.xgcell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.xgcell span.b{display:inline-block;height:6px;border-radius:3px;background:var(--c)}

/* Shot map */
.rink{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
#tip{position:fixed;pointer-events:none;background:#05080cf0;border:1px solid var(--line);padding:8px 11px;border-radius:8px;font:400 13px/1.45 Inter,sans-serif;letter-spacing:0;text-transform:none;color:var(--text);max-width:300px;white-space:normal;display:none;z-index:9;box-shadow:0 6px 20px #0008}
[data-tip]{cursor:help}
.hint,th[data-tip]{text-decoration:underline dotted #5b6673;text-underline-offset:3px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.picker button{display:grid;grid-template-columns:24px 1fr auto 1fr 24px;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text);cursor:pointer;font:600 14px Inter}
.picker button span:nth-of-type(1){text-align:right}.picker button span:nth-of-type(2){text-align:left}
.picker button img{width:24px;height:24px;object-fit:contain}
.picker button b{font:700 18px 'Barlow Condensed';padding:0 4px}
.picker button.on{border-color:#fff;background:#232c37}
.picker button:hover{background:#232c37}
.livetxt{color:#ff6b78}
/* Ketjut */
.lchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.lchips button{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font:600 15px 'Barlow Condensed';letter-spacing:.06em;text-transform:uppercase}
.lchips button.on{border-color:var(--c);color:var(--c);background:#ffffff0d}
tr.click{cursor:pointer}
.lno{font:700 22px 'Barlow Condensed';width:26px}
.avs{display:inline-flex;margin-right:10px}
.av.sm{width:28px;height:28px;margin-right:-8px;border:2px solid var(--panel)}
.lnames{font-size:13px;margin-left:8px;white-space:normal;line-height:1.3}
.ltable td.left{white-space:normal;min-width:260px}
.tablewrap{scrollbar-color:#2a323d transparent}
.split{display:inline-flex;width:60px;height:6px;border-radius:3px;overflow:hidden}
.linegrid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
@media (max-width:860px){.linegrid{grid-template-columns:1fr}}
.formation{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
.formation.d{grid-template-columns:repeat(2,minmax(0,1fr));padding:0 16%}
.fcard{background:var(--panel2);border-radius:10px;overflow:hidden;border-top:3px solid var(--c)}
.fcard .ph{height:120px;position:relative;background:linear-gradient(180deg,#2a323d,#1c232c);display:flex;justify-content:center;align-items:flex-end}
.fcard .ph img{height:100%;object-fit:cover}
.fcard .jn{position:absolute;top:6px;left:8px;font:700 20px 'Barlow Condensed';color:var(--c)}
.fcard .slot{position:absolute;top:8px;right:8px;font:600 11px Inter;background:#0008;padding:1px 6px;border-radius:4px}
.fcard .bd{padding:8px 10px;font-size:12px}
.fcard .pn{font-size:13px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .row{display:flex;justify-content:space-between;gap:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{background:var(--panel2);border-radius:10px;padding:10px 12px}
.tile .tl{font:600 12px 'Barlow Condensed';letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .tv{font:700 26px 'Barlow Condensed'}
.tile .ts{font-size:11px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d5e;margin-right:6px;vertical-align:middle;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
footer{position:sticky;bottom:0;background:#0d1117e6;backdrop-filter:blur(4px);border-top:1px solid var(--line)}
.err{padding:30px;text-align:center}
footer{font-size:12px;color:var(--muted);text-align:center;padding:10px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="panel err muted">Ladataan ottelua…</div></div>
<div id="tip"></div>
<footer><span id="refresh"></span><br>Data: liiga.fi · päivittyy automaattisesti: live-ottelut 30 s välein, päivän pelit vaihtuvat itsestään</footer>

<script>
const API = 'https://www.liiga.fi/api/v2';
const TEAM_A = 'ässät', TEAM_B = 'pelicans';
const $ = s => document.querySelector(s);
const fmt = (n, d = 2) => (n ?? 0).toFixed(d).replace('.', ',');
const toi = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const POS = {GOALIE:'MV',CENTER:'KH',LEFT_WING:'VL',RIGHT_WING:'OL',LEFT_DEFENSEMAN:'VP',RIGHT_DEFENSEMAN:'OP',DEFENSEMAN:'P',SEVENTH_DEFENSEMAN:'P',STRIKER:'H',THIRTEENTH_STRIKER:'H'};

let timer, state = {tab: 'home', sort: 'xg', dir: -1, lineTeam: 'home', line: 'all'};

function seasonOf(d) { return d.getMonth() >= 6 ? d.getFullYear() + 1 : d.getFullYear(); }
function localDate(d) { return d.toLocaleDateString('sv-SE'); }
async function j(url) { const r = await fetch(url); if (!r.ok) throw new Error(r.status + ' ' + url); return r.json(); }

// Hakee päivän ottelut. Jos tänään ei pelata, näytetään viimeisin pelipäivä.
async function findDay() {
  const now = new Date(), season = seasonOf(now), today = localDate(now);
  const lists = await Promise.all(['runkosarja', 'playoffs'].map(t =>
    j(`${API}/games?tournament=${t}&season=${season}`).catch(() => [])));
  const games = lists.flat().filter(g => g?.start);
  if (!games.length) throw new Error('Otteluohjelman haku epäonnistui');
  let day = games.filter(g => localDate(new Date(g.start)) === today);
  let note = '';
  if (!day.length) {
    const last = games.filter(g => g.started).map(g => localDate(new Date(g.start))).sort().at(-1);
    day = games.filter(g => localDate(new Date(g.start)) === last);
    if (last) note = `Tänään ei ole Liiga-otteluita – näytetään viimeisin pelipäivä (${new Date(last).toLocaleDateString('fi-FI')}).`;
  }
  return {season, date: today, games: day.sort((a, b) => new Date(a.start) - new Date(b.start) || a.id - b.id), note};
}

function gamePicker(day, selId) {
  if (!day.games.length) return '';
  return `${day.note ? `<div class="muted" style="margin-bottom:10px">${day.note}</div>` : ''}<div class="picker">${day.games.map(g => {
    const live = g.started && !g.ended;
    const sc = g.started ? `${g.homeTeam.goals}–${g.awayTeam.goals}` : new Date(g.start).toLocaleTimeString('fi-FI', {hour: '2-digit', minute: '2-digit'});
    return `<button data-g="${g.id}" class="${g.id === selId ? 'on' : ''}">
      <img src="${g.homeTeam.logos?.darkBg || ''}" alt=""><span>${g.homeTeam.teamName}</span>
      <b class="num ${live ? 'livetxt' : ''}">${sc}</b>
      <span>${g.awayTeam.teamName}</span><img src="${g.awayTeam.logos?.darkBg || ''}" alt=""></button>`;
  }).join('')}</div>`;
}

const LIVE_MS = 30000, IDLE_MS = 5 * 60000, DONE_MS = 10 * 60000;
let day = null, loading = false, lastOk = null, nextAt = null;
const isLive = g => g.started && !g.ended;

// Seuraava päivitys: live-ottelu → 30 s, alkamassa → aloitushetkeen (max 5 min), kaikki päättyneet → 10 min (päivän vaihdon tarkistus)
function scheduleNext(detailLive) {
  clearTimeout(timer);
  const now = Date.now();
  let ms = DONE_MS;
  if (detailLive || day?.games.some(isLive)) ms = LIVE_MS;
  else {
    const upcoming = (day?.games || []).filter(g => !g.started).map(g => new Date(g.start) - now);
    if (upcoming.length) ms = Math.min(IDLE_MS, Math.max(LIVE_MS, Math.min(...upcoming) + 5000));
  }
  // Herätään viimeistään keskiyön jälkeen, jotta päivä vaihtuu
  const midnight = new Date(); midnight.setHours(24, 0, 30, 0);
  ms = Math.min(ms, midnight - now);
  nextAt = now + ms;
  timer = setTimeout(load, ms);
}

function updateStatus(err) {
  const el = $('#refresh'); if (!el) return;
  const live = day?.games.some(isLive);
  const t = lastOk ? lastOk.toLocaleTimeString('fi-FI') : '–';
  const secs = nextAt ? Math.max(0, Math.round((nextAt - Date.now()) / 1000)) : null;
  el.innerHTML = `${live ? '<span class="dot"></span>LIVE · ' : ''}Päivitetty ${t}` +
    (secs != null ? ` · seuraava ${secs >= 90 ? Math.round(secs / 60) + ' min' : secs + ' s'}` : '') +
    (err ? ` · <span style="color:#ff6b78">päivitys epäonnistui, yritetään uudelleen</span>` : '');
}
setInterval(() => updateStatus(), 1000);

async function load() {
  if (loading) return;
  loading = true;
  try {
    const today = localDate(new Date());
    const pinned = new URLSearchParams(location.search).get('game');
    if (day && day.date !== today && !pinned) state.gameId = null; // uusi päivä → päivän pelit
    day = await findDay();
    const p = new URLSearchParams(location.search);
    let season = day.season, id = state.gameId;
    if (!id && p.get('game')) { id = +p.get('game'); season = +(p.get('season') || season); }
    if (!id) {
      const pref = day.games.find(g => [g.homeTeam.teamId, g.awayTeam.teamId].some(t => t.endsWith(':' + TEAM_A)));
      id = (pref || day.games[0])?.id;
    }
    if (!id) throw new Error('Otteluita ei löytynyt');
    state.gameId = id;
    const [detail, stats, shots] = await Promise.all([
      j(`${API}/games/${season}/${id}`),
      j(`${API}/games/stats/${season}/${id}`).catch(() => null),
      j(`${API}/shotmap/${season}/${id}`).catch(() => []),
    ]);
    if (state.gameId !== id) return; // käyttäjä vaihtoi ottelua latauksen aikana
    const y = scrollY;
    render(detail, stats, shots || []);
    $('#app').insertAdjacentHTML('afterbegin', `<div class="panel">${gamePicker(day, id)}</div>`);
    scrollTo(0, y); // pidetään lukukohta päivityksessä
    document.querySelectorAll('.picker button').forEach(b => b.onclick = () => {
      state.gameId = +b.dataset.g; state.tab = 'home'; state.lineTeam = 'home'; state.line = 'all';
      document.querySelectorAll('.picker button').forEach(x => x.classList.toggle('on', x === b));
      loading = false; load();
    });
    lastOk = new Date();
    scheduleNext(isLive(detail.game));
    updateStatus();
  } catch (e) {
    if (!lastOk) $('#app').innerHTML = `<div class="panel err">Datan lataus epäonnistui: ${e.message}</div>`;
    clearTimeout(timer); nextAt = Date.now() + LIVE_MS; timer = setTimeout(load, LIVE_MS);
    updateStatus(true);
  } finally {
    loading = false;
  }
}

// Kun välilehti palaa näkyviin, päivitetään heti (selain hidastaa ajastimia taustalla)
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && lastOk && Date.now() - lastOk > 15000) load();
});

// Tilastojen selitykset (näkyvät hoveroidessa)
const HELP = {
  xg: 'Maaliodottama (expected goals, xG): kuinka monta maalia laukauksista olisi keskimäärin odotettavissa laukauspaikan, laukaustyypin ja pelitilanteen perusteella. Esim. 0,30 xG = vastaavista laukauksista noin 30 % menee maaliin.',
  goals: 'Tehdyt maalit.',
  sog: 'Laukaukset maalia kohti: laukaukset, jotka menivät maaliin tai jotka maalivahti torjui.',
  att: 'Laukausyritykset: kaikki laukaukset, myös ohi menneet ja kenttäpelaajan blokkaamat.',
  xgps: 'Keskimääräinen maaliodottama per laukausyritys. Kertoo laukausten laadusta: suurempi luku = vaarallisemmilta paikoilta laukottu.',
  fo: 'Voitetut aloitukset (kiekon voitto aloituksessa).',
  ctrl: 'Kiekonhallinta: kuinka suuren osan ajasta joukkue hallitsi kiekkoa (kiistanalaiset tilanteet eivät ole mukana).',
  pp: 'Ylivoimat: kuinka monta kertaa joukkue pääsi pelaamaan ylivoimalla vastustajan jäähyn vuoksi.',
  ppg: 'Ylivoimalla tehdyt maalit.',
  pim: 'Jäähyminuutit yhteensä.',
  dist: 'Joukkueen tai pelaajan yhteensä luistelema matka kilometreinä (seurantadata).',
  timeline: 'Kumulatiivinen maaliodottama: viiva nousee jokaisen laukauksen xG:n verran. Valkoreunaiset pallot ovat maaleja.',
  period: 'Maaliodottama erittäin. Suluissa tehdyt maalit.',
  shotmap: 'Jokainen laukausyritys kaukalossa. Pallon koko kertoo laukauksen xG:n. Maalit on piirretty täydellä värillä ja renkaalla. Vie hiiri pallon päälle nähdäksesi tiedot.',
  leaders: 'Ottelun suurimmat yksittäiset maaliodottamat molemmista joukkueista.',
  lines: 'Ketjut ottelun kokoonpanon mukaan (1.–4. ketju: hyökkääjät + puolustajapari). Valmentaja voi muuttaa ketjuja kesken ottelun, joten ”yhdessä”-luvut kertovat vain ajasta, jolloin ketjun hyökkääjät olivat oikeasti kentällä samaan aikaan.',
  lOwn: 'Ketjun pelaajien omien laukausten yhteenlaskettu maaliodottama (riippumatta siitä, kenen kanssa he pelasivat).',
  lXgf: 'xG puolesta: joukkueen laukausten maaliodottama silloin, kun ketjun kaikki hyökkääjät olivat kentällä yhdessä.',
  lXga: 'xG vastaan: vastustajan laukausten maaliodottama silloin, kun ketjun kaikki hyökkääjät olivat kentällä yhdessä. Pienempi on parempi.',
  lXgp: 'xG %: ketjun osuus maaliodottamasta sen ollessa kentällä (xGF / (xGF + xGA)). Yli 50 % = ketju loi enemmän vaarallisia paikkoja kuin päästi.',
  lCf: 'Laukausyritykset puolesta–vastaan, kun ketjun hyökkääjät olivat kentällä yhdessä.',
  lGf: 'Maalit puolesta–vastaan, kun ketjun hyökkääjät olivat kentällä yhdessä.',
  lPts: 'Ketjun pelaajien yhteenlasketut maalit + syöttöpisteet.',
  lToi: 'Ketjun hyökkääjien keskimääräinen peliaika.',
  l5: 'Koko viisikko (hyökkääjät + puolustajapari) kentällä yhdessä: xG puolesta–vastaan.',
  gk: 'Maalivahtien tilastot laskettuna laukauskartasta. Tyhjään maaliin tehdyt maalit eivät ole mukana.',
  gtoi: 'Maalivahdin peliaika (min:s).',
  gsa: 'Maalivahtia kohti tulleet laukaukset (torjutut + päästetyt).',
  gsv: 'Torjunnat: maalivahdin torjumat laukaukset.',
  gsvp: 'Torjuntaprosentti: torjunnat / laukaukset maalia kohti.',
  gga: 'Päästetyt maalit.',
  gxga: 'Maaliodottama vastaan: maalivahtia kohti tulleiden laukausten yhteenlaskettu xG.',
  gsax: 'GSAx (goals saved above expected): xG vastaan miinus päästetyt maalit. Positiivinen = maalivahti torjui enemmän kuin laukausten laadun perusteella odotettiin.',
  name: 'Pelaajan nimi ja pelinumero.',
  pos: 'Pelipaikka: KH = keskushyökkääjä, VL/OL = vasen/oikea laitahyökkääjä, VP/OP = vasen/oikea puolustaja, P = puolustaja, H = hyökkääjä.',
  g: 'Maalit.', a: 'Syöttöpisteet (maaliin johtaneet syötöt).', pts: 'Pisteet = maalit + syöttöpisteet.',
  pm: 'Plus/miinus: +1 kun pelaaja on kentällä oman joukkueen tehdessä tasakenttä- tai alivoimamaalin, −1 kun vastustaja tekee sellaisen.',
  pxg: 'Pelaajan omien laukausten yhteenlaskettu maaliodottama.',
  patt: 'Laukausyritykset: kaikki pelaajan laukaukset, myös ohi menneet ja blokatut.',
  psh: 'Laukaukset maalia kohti (Liigan virallinen tilasto).',
  toi: 'Peliaika (min:s).',
  xgOn: 'xG kentällä: oman joukkueen maaliodottama silloin, kun pelaaja on ollut kentällä.',
  xgAg: 'xGA kentällä: vastustajan maaliodottama silloin, kun pelaaja on ollut kentällä. Pienempi on parempi.',
  cfp: 'Corsi %: osuus kaikista laukausyrityksistä (omat + vastustajan), jotka oma joukkue laukoi pelaajan ollessa kentällä. Yli 50 % = joukkue hallitsi peliä.',
  fop: 'Aloitukset: voitetut / kaikki aloitukset.',
  blk: 'Blokit: vastustajan laukaukset, jotka pelaaja pysäytti ennen maalivahtia.',
  passp: 'Syötöt: onnistuneet / kaikki syötöt.',
  speed: 'Pelaajan suurin mitattu luistelunopeus ottelussa.',
  hard: 'Pelaajan kovin mitattu laukaus ottelussa.',
};
const tip = k => `data-tip="${(HELP[k] || '').replace(/"/g, '&quot;')}"`;

// Joukkuevärit [pääväri, vaihtoehtoinen]. Vierasjoukkue käyttää vaihtoehtoista, jos väri on liian lähellä kotijoukkuetta.
const COLORS = {
// Ei valkoista eikä vaaleaa: värien pitää erottua sekä vaaleasta kaukalosta että tummasta taustasta.
  'ässät': ['#d6293a', '#9b6bff'], 'pelicans': ['#2aa7e0', '#f39200'], 'jyp': ['#d22630', '#9b6bff'],
  'sport': ['#e4002b', '#14b8a6'], 'jukurit': ['#1b75bc', '#e0a500'], 'jokerit': ['#e2001a', '#e0a500'],
  'kalpa': ['#e0a500', '#9b6bff'], 'lukko': ['#1f78c8', '#e30613'], 'k-espoo': ['#f47b20', '#3f7fd6'],
  'ilves': ['#1ea65a', '#e0a500'], 'tps': ['#9b6bff', '#14b8a6'], 'kärpät': ['#e0a500', '#9b6bff'],
  'hpk': ['#f58220', '#9b6bff'], 'hifk': ['#e30613', '#3f7fd6'], 'tappara': ['#f47920', '#3f7fd6'], 'saipa': ['#e0a500', '#14b8a6'],
};
const SPARE = ['#9b6bff', '#14b8a6', '#e0a500'];
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const cdist = (a, b) => Math.hypot(...rgb(a).map((v, i) => v - rgb(b)[i]));
function teamColor(id, fb, avoid) {
  const [c1, c2] = COLORS[id.split(':')[1]] || [fb, fb];
  if (!avoid || cdist(c1, avoid) > 140) return c1;
  if (cdist(c2, avoid) > 140) return c2;
  return [fb, ...SPARE].find(c => cdist(c, avoid) > 140) || SPARE[0];
}

function aggregate(periods, roster, shots, teamNum) {
  const P = new Map();
  for (const per of periods || []) for (const s of per.periodPlayerStats) {
    const p = P.get(s.playerId) || {id: s.playerId, jersey: s.jerseyId, g:0,a:0,pts:0,pm:0,sh:0,toi:0,blk:0,fo:0,fow:0,cf:0,ca:0,xg:0,xgOn:0,xgAg:0,pass:0,passOk:0,dist:0};
    const q = s.period;
    p.g += q.goals; p.a += q.assists; p.pts += q.points; p.pm += q.plusminus; p.sh += q.shots;
    p.toi += q.timeofice; p.blk += q.blockedShots; p.fo += q.faceoffsTotal; p.fow += q.faceoffsWon;
    p.cf += q.corsiFor; p.ca += q.corsiAgainst; p.xg += s.expectedGoalsPlayer || 0;
    p.xgOn += s.expectedGoalsTeam || 0; p.xgAg += s.expectedGoalsAgainst || 0;
    p.pass += s.totalPasses || 0; p.passOk += s.successfulPasses || 0; p.dist += s.distance || 0;
    P.set(s.playerId, p);
  }
  // Laukaukset kartasta (kaikki yritykset)
  for (const s of shots) if (s.shootingTeamId === teamNum && P.has(s.shooterId)) {
    const p = P.get(s.shooterId); p.att = (p.att || 0) + 1;
  }
  const R = new Map(roster.map(r => [r.id, r]));
  return [...P.values()].map(p => {
    const r = R.get(p.id) || {};
    return {...p, first: r.firstName || '', last: r.lastName || '#' + p.jersey, pic: r.pictureUrl, role: r.role, pos: POS[r.role] || ''};
  }).filter(p => p.role !== 'GOALIE');
}

function render(d, stats, shots) {
  const g = d.game, H = g.homeTeam, A = g.awayTeam;
  const hNum = +H.teamId.split(':')[0], aNum = +A.teamId.split(':')[0];
  const roster = [...d.homeTeamPlayers, ...d.awayTeamPlayers];
  const byId = new Map(roster.map(r => [r.id, r]));
  const extra = new Map([...(stats?.homeTeamGamePlayerStats || []), ...(stats?.awayTeamGamePlayerStats || [])].map(x => [x.playerId, x]));
  const home = aggregate(stats?.homeTeam, d.homeTeamPlayers, shots, hNum);
  const away = aggregate(stats?.awayTeam, d.awayTeamPlayers, shots, aNum);
  for (const p of [...home, ...away]) { const e = extra.get(p.id) || {}; p.speed = e.topSpeed; p.hard = e.hardestShot; }

  const xgH = H.expectedGoals ?? shots.filter(s => s.shootingTeamId === hNum).reduce((t, s) => t + (s.xg || 0), 0);
  const xgA = A.expectedGoals ?? shots.filter(s => s.shootingTeamId === aNum).reduce((t, s) => t + (s.xg || 0), 0);
  const tot = xgH + xgA || 1;

  let status = 'Tulossa ' + new Date(g.start).toLocaleString('fi-FI', {weekday:'short', day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit'});
  let live = false;
  if (g.ended) status = 'Päättynyt' + (g.finishedType?.includes('OVERTIME') ? ' (ja)' : g.finishedType?.includes('WINNING_SHOT') ? ' (vl)' : '');
  else if (g.started) { live = true; status = `LIVE · ${g.currentPeriod || ''}. erä · ${toi(g.gameTime || 0)}`; }

  document.documentElement.style.setProperty('--home', teamColor(H.teamId, '#d6293a'));
  document.documentElement.style.setProperty('--away', teamColor(A.teamId, '#2aa7e0', teamColor(H.teamId, '#d6293a')));
  $('#app').innerHTML = `
    <div class="panel">
      <div class="score">
        <div class="team"><img src="${H.logos?.darkBg || ''}" alt=""><div class="nm">${H.teamName}</div></div>
        <div><div class="big num">${H.goals} – ${A.goals}</div><div class="status ${live ? 'live' : ''}">${status}</div>
          <div class="muted" style="font-size:12px;margin-top:6px">${g.iceRink?.name || ''}${g.spectators ? ' · ' + g.spectators + ' katsojaa' : ''}</div></div>
        <div class="team"><img src="${A.logos?.darkBg || ''}" alt=""><div class="nm">${A.teamName}</div></div>
      </div>
      <div class="xgrow">
        <div class="xgval num" style="color:var(--home);text-align:right">${fmt(xgH)}</div>
        <div class="xglbl" ${tip('xg')}>Maaliodottama (xG) ⓘ</div>
        <div class="xgval num" style="color:var(--away)">${fmt(xgA)}</div>
      </div>
      <div class="bar"><div style="width:${xgH / tot * 100}%;background:var(--home)"></div><div style="width:${xgA / tot * 100}%;background:var(--away)"></div></div>
    </div>

    <div class="grid2">
      <div class="panel"><h2>Joukkueet</h2>${teamCompare(g, stats, shots, hNum, aNum, xgH, xgA)}</div>
      <div class="panel"><h2><span ${tip('timeline')}>xG ottelun kulussa ⓘ</span></h2>${xgTimeline(shots, hNum, aNum, g)}${periodTable(shots, hNum, aNum, H, A)}</div>
    </div>

    <div class="panel"><h2><span ${tip('shotmap')}>Laukauskartta ⓘ</span></h2>${rink(shots, hNum, byId)}
      <div class="legend"><span><i style="background:var(--home)"></i>${H.teamName}</span><span><i style="background:var(--away)"></i>${A.teamName}</span>
      <span><i style="background:#8b97a5;border:2px solid #0d1117;box-shadow:0 0 0 2px #8b97a5"></i>Maali (täysi väri + rengas)</span><span>Pallon koko = xG · ${H.teamName} hyökkää oikealle</span></div></div>

    <div class="panel"><h2><span ${tip('leaders')}>Suurimmat maaliodottamat ⓘ</span></h2><div class="leaders">${leaders(home, away)}</div></div>

    <div class="panel">
      <h2><span ${tip('lines')}>Ketjut ⓘ</span></h2>
      <div class="tabs" id="ltabs">
        <button data-t="home" style="--c:var(--home)" class="${state.lineTeam === 'home' ? 'on' : ''}">${H.teamName}</button>
        <button data-t="away" style="--c:var(--away)" class="${state.lineTeam === 'away' ? 'on' : ''}">${A.teamName}</button>
      </div>
      <div id="lines"></div>
    </div>

    <div class="panel"><h2><span ${tip('gk')}>Maalivahdit ⓘ</span></h2>${goalies(d, stats, shots, hNum, aNum, byId)}</div>

    <div class="panel">
      <h2>Pelaajatilastot</h2>
      <div class="tabs" id="ptabs">
        <button data-t="home" style="--c:var(--home)" class="${state.tab === 'home' ? 'on' : ''}">${H.teamName}</button>
        <button data-t="away" style="--c:var(--away)" class="${state.tab === 'away' ? 'on' : ''}">${A.teamName}</button>
      </div>
      <div class="tablewrap" id="ptable"></div>
    </div>`;

  const drawTable = () => $('#ptable').innerHTML = playerTable(state.tab === 'home' ? home : away, state.tab === 'home' ? 'var(--home)' : 'var(--away)');
  drawTable();
  document.querySelectorAll('#ptabs button').forEach(b => b.onclick = () => {
    state.tab = b.dataset.t; document.querySelectorAll('#ptabs button').forEach(x => x.classList.toggle('on', x === b)); drawTable();
  });

  // Ketjut
  const lineData = {
    home: buildLines(d.homeTeamPlayers, home, shots, hNum),
    away: buildLines(d.awayTeamPlayers, away, shots, aNum),
  };
  const drawLines = () => {
    const side = state.lineTeam, ls = lineData[side];
    if (state.line !== 'all' && !ls.some(l => l.n === state.line)) state.line = 'all';
    $('#lines').innerHTML = linesView(ls, side === 'home' ? 'var(--home)' : 'var(--away)', hNum, byId);

  drawLines();
  document.querySelectorAll('#ltabs button').forEach(b => b.onclick = () => {
    state.lineTeam = b.dataset.t; document.querySelectorAll('#ltabs button').forEach(x => x.classList.toggle('on', x === b)); drawLines();
  });
  $('#lines').onclick = e => {
    const el = e.target.closest('[data-line]'); if (!el) return;
    state.line = el.dataset.line === 'all' ? 'all' : +el.dataset.line; drawLines();
  };
  $('#ptable').onclick = e => {
    const th = e.target.closest('th'); if (!th) return;
    const k = th.dataset.k; state.dir = state.sort === k ? -state.dir : -1; state.sort = k; drawTable();
  };
}

// Tooltipit: yksi kuuntelija koko sivulle, toimii myös uudelleen piirretyille elementeille
(() => {
  const box = $('#tip');
  const show = (el, x, y) => {
    box.innerHTML = el.dataset.tip; box.style.display = 'block';
    const w = box.offsetWidth, h = box.offsetHeight;
    box.style.left = Math.max(8, Math.min(x + 14, innerWidth - w - 8)) + 'px';
    box.style.top = (y + 14 + h > innerHeight ? y - h - 10 : y + 14) + 'px';
  };
  document.addEventListener('mousemove', e => {
    const el = e.target.closest?.('[data-tip]');
    if (el && el.dataset.tip) show(el, e.clientX, e.clientY); else box.style.display = 'none';
  });
  document.addEventListener('touchstart', e => {
    const el = e.target.closest?.('[data-tip]'), t = e.touches[0];
    if (el && el.dataset.tip) show(el, t.clientX, t.clientY); else box.style.display = 'none';
  }, {passive: true});
})();

function cmpRow(label, k, h, a, fh = String, fa = fh) {
  const t = (h + a) || 1;
  return `<div class="cmp"><div class="l num">${fh(h)}</div><div><div class="mid"><span ${tip(k)} class="hint">${label}</span></div>
    <div class="mini"><div style="width:${h / t * 100}%;background:var(--home)"></div><div style="width:${a / t * 100}%;background:var(--away)"></div></div></div>
    <div class="r num">${fa(a)}</div></div>`;
}

function teamCompare(g, stats, shots, hNum, aNum, xgH, xgA) {
  const sum = (arr, k) => (arr || []).reduce((t, x) => t + (x[k] || 0), 0);
  const sh = n => shots.filter(s => s.shootingTeamId === n);
  const sog = n => sh(n).filter(s => s.eventType === 'GOAL' || s.eventType === 'GOALIE_BLOCKED').length;
  const hp = stats?.homeTeam, ap = stats?.awayTeam;
  const pk = stats?.puckStats || [];
  const ctrlH = sum(pk, 'homeTeamControlDuration'), ctrlA = sum(pk, 'awayTeamControlDuration');
  const foH = sum(hp, 'faceOffWins'), foA = sum(ap, 'faceOffWins');
  const ppH = g.homeTeam.powerplayInstances || 0, ppA = g.awayTeam.powerplayInstances || 0;
  const xgPerShot = (x, n) => n ? x / n : 0;
  const pct = v => Math.round(v) + ' %';
  const ctrlT = ctrlH + ctrlA || 1;
  return [
    cmpRow('Maalit', 'goals', g.homeTeam.goals, g.awayTeam.goals),
    cmpRow('Maaliodottama', 'xg', xgH, xgA, v => fmt(v)),
    cmpRow('Laukaukset maalia kohti', 'sog', sog(hNum), sog(aNum)),
    cmpRow('Laukausyritykset', 'att', sh(hNum).length, sh(aNum).length),
    cmpRow('xG / laukausyritys', 'xgps', xgPerShot(xgH, sh(hNum).length), xgPerShot(xgA, sh(aNum).length), v => fmt(v, 3)),
    cmpRow('Aloitusvoitot', 'fo', foH, foA),
    ctrlT > 1 ? cmpRow('Kiekonhallinta', 'ctrl', ctrlH / ctrlT * 100, ctrlA / ctrlT * 100, pct) : '',
    cmpRow('Ylivoimat', 'pp', ppH, ppA),
    cmpRow('Ylivoimamaalit', 'ppg', g.homeTeam.powerplayGoals || 0, g.awayTeam.powerplayGoals || 0),
    cmpRow('Jäähyminuutit', 'pim', sum(hp, 'penaltyMinutes'), sum(ap, 'penaltyMinutes')),
    cmpRow('Luisteltu matka (km)', 'dist', sum(hp, 'totalDistanceTravelled') / 1000, sum(ap, 'totalDistanceTravelled') / 1000, v => fmt(v, 1)),
  ].join('');
}

function xgTimeline(shots, hNum, aNum, g) {
  const W = 520, Hh = 210, pad = 30;
  const end = Math.max(3600, g.gameTime || 0, ...shots.map(s => s.gameTime));
  const sorted = [...shots].sort((a, b) => a.gameTime - b.gameTime);
  const series = n => { let c = 0; const pts = [[0, 0]]; for (const s of sorted) if (s.shootingTeamId === n) { pts.push([s.gameTime, c]); c += s.xg || 0; pts.push([s.gameTime, c]); } pts.push([g.ended ? end : Math.max(g.gameTime || end, pts.at(-1)[0]), c]); return pts; };
  const h = series(hNum), a = series(aNum);
  const max = Math.max(1, h.at(-1)[1], a.at(-1)[1]) * 1.1;
  const X = t => pad + t / end * (W - pad - 10), Y = v => Hh - pad + 8 - v / max * (Hh - pad - 10);
  const path = pts => 'M' + pts.map(([t, v]) => `${X(t).toFixed(1)},${Y(v).toFixed(1)}`).join('L');
  const goals = sorted.filter(s => s.eventType === 'GOAL');
  const cum = (n, t) => sorted.filter(s => s.shootingTeamId === n && s.gameTime <= t).reduce((x, s) => x + (s.xg || 0), 0);
  let grid = '';
  for (let p = 1200; p < end; p += 1200) grid += `<line x1="${X(p)}" x2="${X(p)}" y1="10" y2="${Hh - pad + 8}" stroke="#2a323d" stroke-dasharray="3 3"/>`;
  for (let v = 0; v <= max; v += max > 3 ? 1 : 0.5) grid += `<line x1="${pad}" x2="${W - 10}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1f262f"/><text x="${pad - 6}" y="${Y(v) + 4}" fill="#8b97a5" font-size="10" text-anchor="end">${fmt(v, 1)}</text>`;
  const labels = [1, 2, 3].map(p => `<text x="${X((p - .5) * 1200)}" y="${Hh - 4}" fill="#8b97a5" font-size="11" text-anchor="middle">${p}. erä</text>`).join('');
  const gm = goals.map(s => { const n = s.shootingTeamId; return `<circle cx="${X(s.gameTime)}" cy="${Y(cum(n, s.gameTime))}" r="6" fill="${n === hNum ? 'var(--home)' : 'var(--away)'}" stroke="#fff" stroke-width="2.5" data-tip="Maali ${toi(s.gameTime)}"/>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${Hh}" style="width:100%">${grid}${labels}
    <path d="${path(h)}" fill="none" stroke="var(--home)" stroke-width="2.5"/><path d="${path(a)}" fill="none" stroke="var(--away)" stroke-width="2.5"/>${gm}</svg>`;
}

function periodTable(shots, hNum, aNum, H, A) {
  const periods = [...new Set(shots.map(s => s.period))].sort();
  const x = (n, p) => shots.filter(s => s.shootingTeamId === n && s.period === p).reduce((t, s) => t + (s.xg || 0), 0);
  const gl = (n, p) => shots.filter(s => s.shootingTeamId === n && s.period === p && s.eventType === 'GOAL').length;
  const name = p => p <= 3 ? p + '. erä' : 'Jatkoaika';
  return `<table style="margin-top:10px"><thead><tr><th class="left" ${tip('period')}>xG (maalit)</th>${periods.map(p => `<th>${name(p)}</th>`).join('')}</tr></thead><tbody>
    <tr><td style="color:var(--home);font-weight:600">${H.teamName}</td>${periods.map(p => `<td class="num">${fmt(x(hNum, p))} <span class="muted">(${gl(hNum, p)})</span></td>`).join('')}</tr>
    <tr><td style="color:var(--away);font-weight:600">${A.teamName}</td>${periods.map(p => `<td class="num">${fmt(x(aNum, p))} <span class="muted">(${gl(aNum, p)})</span></td>`).join('')}</tr></tbody></table>`;
}

function rink(shots, hNum, byId) {
  const W = 1000, H = 500;
  const TYPE = {EvenStrengthShot: 'Tasakenttä', PowerplayShot: 'Ylivoima', ShorthandedShot: 'Alivoima'};
  const RES = {GOAL: 'MAALI', GOALIE_BLOCKED: 'Torjuttu', PLAYER_BLOCKED: 'Blokattu', MISSED: 'Ohi'};
  const dots = [...shots].sort((a, b) => (a.eventType === 'GOAL') - (b.eventType === 'GOAL')).map(s => {
    // leftTeam hyökkää oikealle. Normalisoidaan: kotijoukkue aina oikealle.
    const shooterAttacksRight = s.shootingTeamId === s.leftTeam;
    const isHome = s.shootingTeamId === hNum;
    let x = s.shotX, y = s.shotY;
    if (shooterAttacksRight !== isHome) { x = W - x; y = H - y; }
    const r = 4 + Math.sqrt(s.xg || 0) * 22;
    const p = byId.get(s.shooterId);
    const goal = s.eventType === 'GOAL';
    const col = isHome ? 'var(--home)' : 'var(--away)';
    const tip = `<b>${p ? p.firstName + ' ' + p.lastName : 'Tuntematon'}</b><br>${RES[s.eventType] || s.eventType} · ${TYPE[s.type] || ''}<br>xG ${fmt(s.xg, 3)} · ${s.period}. erä ${toi(s.gameTime - (s.period - 1) * 1200)}`;
    const t = tip.replace(/"/g, '&quot;');
    return goal
      ? `<circle cx="${x}" cy="${y}" r="${r + 6}" fill="none" stroke="${col}" stroke-width="3"/><circle cx="${x}" cy="${y}" r="${r}" fill="${col}" stroke="#0d1117" stroke-width="4" data-tip="${t}"/>`
      : `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" fill-opacity=".6" stroke="#0d1117" stroke-opacity=".45" stroke-width="1.5" data-tip="${t}"/>`;
  }).join('');
  const gl = 67, bl = 375; // maaliviiva 4 m, siniviiva 22,5 m (60 m kaukalo)
  return `<svg class="rink" viewBox="-6 -6 ${W + 12} ${H + 12}">
    <rect x="0" y="0" width="${W}" height="${H}" rx="140" fill="#eef3f7" stroke="#9aa7b4" stroke-width="4"/>
    <line x1="${W / 2}" x2="${W / 2}" y1="0" y2="${H}" stroke="#d6293a" stroke-width="6" opacity=".55"/>
    <line x1="${bl}" x2="${bl}" y1="0" y2="${H}" stroke="#2563eb" stroke-width="7" opacity=".55"/>
    <line x1="${W - bl}" x2="${W - bl}" y1="0" y2="${H}" stroke="#2563eb" stroke-width="7" opacity=".55"/>
    <line x1="${gl}" x2="${gl}" y1="12" y2="${H - 12}" stroke="#d6293a" stroke-width="2" opacity=".6"/>
    <line x1="${W - gl}" x2="${W - gl}" y1="12" y2="${H - 12}" stroke="#d6293a" stroke-width="2" opacity=".6"/>
    <circle cx="${W / 2}" cy="${H / 2}" r="75" fill="none" stroke="#2563eb" stroke-width="2" opacity=".5"/>
    ${[[167, 140], [167, 360], [833, 140], [833, 360]].map(([cx, cy]) => `<circle cx="${cx}" cy="${cy}" r="75" fill="none" stroke="#d6293a" stroke-width="2" opacity=".45"/><circle cx="${cx}" cy="${cy}" r="5" fill="#d6293a" opacity=".6"/>`).join('')}
    <path d="M${gl},220 a30,30 0 0 1 0,60" fill="#bfe3f7" stroke="#d6293a" stroke-width="2" opacity=".8"/>
    <path d="M${W - gl},220 a30,30 0 0 0 0,60" fill="#bfe3f7" stroke="#d6293a" stroke-width="2" opacity=".8"/>
    <rect x="${gl - 16}" y="235" width="16" height="30" fill="none" stroke="#555" stroke-width="2"/>
    <rect x="${W - gl}" y="235" width="16" height="30" fill="none" stroke="#555" stroke-width="2"/>
    ${dots}</svg>`;
}

const FWD = ['LEFT_WING', 'CENTER', 'RIGHT_WING'], DEF = ['LEFT_DEFENSEMAN', 'RIGHT_DEFENSEMAN'];
const xgSum = arr => arr.reduce((t, s) => t + (s.xg || 0), 0);
const goalsIn = arr => arr.filter(s => s.eventType === 'GOAL').length;

// Kokoaa ketjut 1–4 kokoonpanosta ja laskee laukauskartasta luvut ajalta, jolloin ketju oli kentällä yhdessä
function buildLines(rosterTeam, agg, shots, teamNum) {
  const P = new Map(agg.map(p => [p.id, p]));
  const out = [];
  for (let n = 1; n <= 4; n++) {
    const mem = rosterTeam.filter(r => r.line === n && r.role !== 'GOALIE' && P.has(r.id));
    if (!mem.length) continue;
    const ord = (list, roles) => list.filter(r => roles.includes(r.role)).sort((a, b) => roles.indexOf(a.role) - roles.indexOf(b.role)).map(r => P.get(r.id));
    const fw = ord(mem, FWD), df = ord(mem, DEF);
    const ex = mem.filter(r => !FWD.includes(r.role) && !DEF.includes(r.role)).map(r => P.get(r.id));
    const together = ids => {
      if (!ids.length) return null;
      const on = shots.filter(s => ids.every(id => s.playerStartPositions?.some(q => q.playerId === id)));
      const f = on.filter(s => s.shootingTeamId === teamNum), a = on.filter(s => s.shootingTeamId !== teamNum);
      return {shots: on, xgf: xgSum(f), xga: xgSum(a), cf: f.length, ca: a.length, gf: goalsIn(f), ga: goalsIn(a)};
    };
    const all = [...fw, ...df, ...ex];
    out.push({
      n, fw, df, ex, all,
      own: all.reduce((t, p) => t + p.xg, 0),
      g: all.reduce((t, p) => t + p.g, 0), a: all.reduce((t, p) => t + p.a, 0),
      toi: fw.length ? fw.reduce((t, p) => t + p.toi, 0) / fw.length : 0,
      trio: together(fw.map(p => p.id)),
      five: df.length === 2 && fw.length === 3 ? together([...fw, ...df].map(p => p.id)) : null,
    });
  }
  return out;
}

const pctOf = (f, a) => f + a > 0 ? f / (f + a) * 100 : null;
function splitBar(f, a, col) {
  const p = pctOf(f, a);
  if (p == null) return '<span class="muted">–</span>';
  return `<div class="split"><div style="width:${p}%;background:${col}"></div><div style="width:${100 - p}%;background:#56606c"></div></div><b class="num">${Math.round(p)} %</b>`;
}

function linesView(lines, col, hNum, byId) {
  if (!lines.length) return '<div class="muted">Ketjutietoja ei ole saatavilla tälle ottelulle.</div>';
  const chips = `<div class="lchips">
    <button data-line="all" class="${state.line === 'all' ? 'on' : ''}" style="--c:${col}">Kaikki ketjut</button>
    ${lines.map(l => `<button data-line="${l.n}" class="${state.line === l.n ? 'on' : ''}" style="--c:${col}">${l.n}. ketju</button>`).join('')}</div>`;
  const av = p => `<img class="av sm" src="${p.pic || ''}" onerror="this.style.visibility='hidden'" alt="" title="${p.first} ${p.last}">`;
  const names = l => [...l.fw, ...l.df].map(p => p.last).join(' – ');
  const maxOwn = Math.max(.01, ...lines.map(l => l.own));

  if (state.line === 'all') {
    return chips + `<div class="tablewrap"><table class="ltable" style="--c:${col}"><thead><tr>
      <th class="left">Ketju</th><th ${tip('lOwn')}>Omat xG</th><th ${tip('lXgf')}>xG puolesta</th><th ${tip('lXga')}>xG vastaan</th>
      <th ${tip('lXgp')}>xG %</th><th ${tip('lCf')}>Lauk.yr. +/−</th><th ${tip('lGf')}>Maalit +/−</th><th ${tip('lPts')}>M + S</th><th ${tip('lToi')}>Peliaika</th></tr></thead><tbody>
      ${lines.map(l => { const t = l.trio; return `<tr data-line="${l.n}" class="click">
        <td class="left"><div class="pl"><b class="lno" style="color:${col}">${l.n}.</b><span class="avs">${[...l.fw, ...l.df].map(av).join('')}</span>
          <span class="lnames">${names(l)}</span></div></td>
        <td><div class="xgcell"><span class="b" style="width:${l.own / maxOwn * 50}px"></span><b class="num">${fmt(l.own)}</b></div></td>
        <td class="num">${t ? fmt(t.xgf) : '–'}</td><td class="num">${t ? fmt(t.xga) : '–'}</td>
        <td><div class="xgcell">${t ? splitBar(t.xgf, t.xga, col) : '–'}</div></td>
        <td class="num">${t ? `${t.cf}–${t.ca}` : '–'}</td><td class="num">${t ? `${t.gf}–${t.ga}` : '–'}</td>
        <td class="num">${l.g} + ${l.a}</td><td class="num">${toi(l.toi)}</td></tr>`; }).join('')}
      </tbody></table></div>
      <div class="muted" style="font-size:12px;margin-top:8px">Klikkaa ketjua nähdäksesi pelaajat ja ketjun laukauskartan. ”Puolesta/vastaan” = ketjun hyökkääjät kentällä yhdessä.</div>`;
  }

  const l = lines.find(x => x.n === state.line), t = l.trio;
  const card = (p, slot) => `<div class="fcard" style="--c:${col}">
    <div class="ph">${p.pic ? `<img src="${p.pic}" alt="" loading="lazy" onerror="this.remove()">` : ''}<span class="jn">#${p.jersey}</span><span class="slot">${slot}</span></div>
    <div class="bd"><div class="pn">${p.first} <b>${p.last}</b></div>
    <div class="row"><span ${tip('pxg')}>xG <b class="num">${fmt(p.xg)}</b></span><span>${p.g} M · ${p.a} S</span></div>
    <div class="row muted"><span>${p.att || 0} lauk.yr.</span><span>${toi(p.toi)}</span><span>${p.pm > 0 ? '+' : ''}${p.pm}</span></div></div></div>`;
  const SL = {LEFT_WING: 'VL', CENTER: 'KH', RIGHT_WING: 'OL', LEFT_DEFENSEMAN: 'VP', RIGHT_DEFENSEMAN: 'OP'};
  const slot = p => SL[p.role] || p.pos || '';
  const tile = (k, label, val, sub = '') => `<div class="tile" ${tip(k)}><div class="tl">${label}</div><div class="tv num">${val}</div>${sub ? `<div class="ts">${sub}</div>` : ''}</div>`;
  return chips + `<div class="linegrid">
    <div>
      <div class="formation">${l.fw.map(p => card(p, slot(p))).join('')}</div>
      ${l.df.length ? `<div class="formation d">${l.df.map(p => card(p, slot(p))).join('')}</div>` : ''}
      ${l.ex.length ? `<div class="muted" style="font-size:12px;margin:10px 0 6px">Lisäpelaajat</div><div class="formation d">${l.ex.map(p => card(p, p.pos)).join('')}</div>` : ''}
    </div>
    <div>
      <div class="tiles">
        ${tile('lOwn', 'Omat xG', fmt(l.own), `${l.g} maalia · ${l.a} syöttöä`)}
        ${tile('lXgp', 'xG % yhdessä', t && pctOf(t.xgf, t.xga) != null ? Math.round(pctOf(t.xgf, t.xga)) + ' %' : '–')}
        ${tile('lXgf', 'xG puolesta', t ? fmt(t.xgf) : '–', t ? `${t.cf} laukausyritystä · ${t.gf} maalia` : '')}
        ${tile('lXga', 'xG vastaan', t ? fmt(t.xga) : '–', t ? `${t.ca} laukausyritystä · ${t.ga} maalia` : '')}
        ${l.five ? tile('l5', 'Koko viisikko', `${fmt(l.five.xgf)} – ${fmt(l.five.xga)}`, `maalit ${l.five.gf}–${l.five.ga}`) : ''}
        ${tile('lToi', 'Peliaika (hyökk. ka.)', toi(l.toi))}
      </div>
      <div class="muted" style="font-size:12px;margin:12px 0 6px">Laukaukset, kun ${l.n}. ketjun hyökkääjät olivat kentällä yhdessä</div>
      ${t && t.shots.length ? rink(t.shots, hNum, byId) : '<div class="muted">Ei laukauksia ketjun ollessa kentällä yhdessä.</div>'}
    </div></div>`;
}

function leaders(home, away) {
  const all = [...home.map(p => ({...p, c: 'var(--home)'})), ...away.map(p => ({...p, c: 'var(--away)'}))]
    .filter(p => p.xg > 0).sort((a, b) => b.xg - a.xg).slice(0, 8);
  return all.map(p => `<div class="card" style="--c:${p.c}">
    <div class="jn">#${p.jersey}</div>
    <div class="ph">${p.pic ? `<img src="${p.pic}" alt="${p.first} ${p.last}" loading="lazy" onerror="this.remove()">` : ''}</div>
    <div class="bd"><div class="sub">${p.first}</div><div class="pn">${p.last}</div>
    <div class="xg num">${fmt(p.xg)} <span style="font-size:14px;color:var(--muted)">xG</span></div>
    <div class="sub">${p.g} M · ${p.a} S · ${p.att || 0} laukausyritystä · ${toi(p.toi)}</div></div></div>`).join('');
}

function goalies(d, stats, shots, hNum, aNum, byId) {
  const rows = [];
  for (const [side, num, oppNum, col] of [['homeTeam', hNum, aNum, 'var(--home)'], ['awayTeam', aNum, hNum, 'var(--away)']]) {
    // Maalivahti per erä = eniten peliaikaa saanut
    const perGk = {};
    for (const per of stats?.[side] || []) {
      const gks = per.goaliePeriodStats || []; if (!gks.length) continue;
      const main = gks.reduce((a, b) => (b.period.timeofice > a.period.timeofice ? b : a));
      perGk[per.period] = main.playerId;
      for (const gk of gks) { const r = rows.find(x => x.id === gk.playerId) || (rows.push({id: gk.playerId, col, toi: 0, sa: 0, ga: 0, xga: 0}), rows.at(-1)); r.toi += gk.period.timeofice; }
    }
    const empty = (d.game[side].goalKeeperEvents || []).filter(e => e.emptyNet || !e.playerId);
    for (const s of shots) {
      if (s.shootingTeamId !== oppNum || !(s.eventType === 'GOAL' || s.eventType === 'GOALIE_BLOCKED')) continue;
      if (empty.some(e => s.gameTime >= e.beginTime && s.gameTime <= (e.endTime ?? 1e9))) continue; // tyhjä maali
      const gid = s.eventType === 'GOALIE_BLOCKED' ? s.blockerId : perGk[s.period];
      const r = rows.find(x => x.id === gid); if (!r) continue;
      r.sa++; r.xga += s.xg || 0; if (s.eventType === 'GOAL') r.ga++;
    }
  }
  const list = rows.filter(r => r.toi > 0);
  if (!list.length) return '<div class="muted">Ei maalivahtidataa.</div>';
  return `<div class="tablewrap"><table><thead><tr><th class="left">Maalivahti</th><th ${tip('gtoi')}>Peliaika</th><th ${tip('gsa')}>Laukaukset</th><th ${tip('gsv')}>Torjunnat</th><th ${tip('gsvp')}>Torjunta-%</th><th ${tip('gga')}>Päästetyt</th><th ${tip('gxga')}>xG vastaan</th><th ${tip('gsax')}>GSAx</th></tr></thead><tbody>
    ${list.map(r => { const p = byId.get(r.id) || {}; const gsax = r.xga - r.ga; return `<tr>
      <td><div class="pl"><img class="av" src="${p.pictureUrl || ''}" onerror="this.style.visibility='hidden'" alt=""><span><b style="color:${r.col}">#${p.jersey ?? ''}</b> ${p.firstName || ''} ${p.lastName || ''}</span></div></td>
      <td class="num">${toi(r.toi)}</td><td class="num">${r.sa}</td><td class="num">${r.sa - r.ga}</td>
      <td class="num">${r.sa ? fmt((r.sa - r.ga) / r.sa * 100, 1) + ' %' : '–'}</td><td class="num">${r.ga}</td>
      <td class="num">${fmt(r.xga)}</td><td class="num" style="color:${gsax >= 0 ? '#5ad17a' : '#ff6b78'}">${gsax >= 0 ? '+' : ''}${fmt(gsax)}</td></tr>`; }).join('')}
    </tbody></table></div><div class="muted" style="font-size:12px;margin-top:6px">Laskettu laukauskartasta (maalia kohti menneet laukaukset). GSAx = torjutut maalit yli odotetun.</div>`;
}

function playerTable(list, col) {
  const cols = [
    ['name', 'Pelaaja'], ['pos', 'Pelip.'], ['xg', 'xG'], ['g', 'M'], ['a', 'S'], ['pts', 'P'], ['pm', '+/−'],
    ['att', 'Lauk.yr.'], ['sh', 'Lauk. MK'], ['toi', 'Peliaika'], ['xgOn', 'xG kentällä'], ['xgAg', 'xGA kentällä'],
    ['cfp', 'Corsi %'], ['fop', 'Aloitukset'], ['blk', 'Blokit'], ['passp', 'Syötöt'], ['dist', 'Matka km'], ['speed', 'Huippunop.'], ['hard', 'Kovin lauk.'],
  ];
  const rows = list.map(p => ({...p, name: p.last, cfp: p.cf + p.ca ? p.cf / (p.cf + p.ca) * 100 : -1,
    fop: p.fo ? p.fow / p.fo * 100 : -1, passp: p.pass ? p.passOk / p.pass * 100 : -1, att: p.att || 0}));
  rows.sort((a, b) => { const x = a[state.sort], y = b[state.sort]; return (typeof x === 'string' ? x.localeCompare(y, 'fi') : (x ?? -1) - (y ?? -1)) * state.dir; });
  const maxXg = Math.max(.01, ...list.map(p => p.xg));
  const HK = {xg: 'pxg', att: 'patt', sh: 'psh'};
  return `<table style="--c:${col}"><thead><tr>${cols.map(([k, l]) => `<th data-k="${k}" ${tip(HK[k] || k)} class="${state.sort === k ? 'sorted' : ''}">${l}${state.sort === k ? (state.dir < 0 ? ' ▾' : ' ▴') : ''}</th>`).join('')}</tr></thead><tbody>
  ${rows.map(p => `<tr>
    <td><div class="pl"><img class="av" src="${p.pic || ''}" loading="lazy" onerror="this.style.visibility='hidden'" alt=""><span><b style="color:${col}">#${p.jersey}</b> ${p.first} ${p.last}</span></div></td>
    <td>${p.pos}</td>
    <td><div class="xgcell"><span class="b" style="width:${p.xg / maxXg * 50}px"></span><b class="num">${fmt(p.xg)}</b></div></td>
    <td class="num">${p.g}</td><td class="num">${p.a}</td><td class="num">${p.pts}</td><td class="num">${p.pm > 0 ? '+' : ''}${p.pm}</td>
    <td class="num">${p.att}</td><td class="num">${p.sh}</td><td class="num">${toi(p.toi)}</td>
    <td class="num">${fmt(p.xgOn)}</td><td class="num">${fmt(p.xgAg)}</td>
    <td class="num">${p.cfp >= 0 ? Math.round(p.cfp) + ' %' : '–'}</td>
    <td class="num">${p.fo ? `${p.fow}/${p.fo}` : '–'}</td><td class="num">${p.blk}</td>
    <td class="num">${p.pass ? `${p.passOk}/${p.pass}` : '–'}</td><td class="num">${fmt(p.dist / 1000, 1)}</td>
    <td class="num">${p.speed ? fmt(p.speed * 3.6, 1) + ' km/h' : '–'}</td><td class="num">${p.hard ? fmt(p.hard * 3.6, 0) + ' km/h' : '–'}</td>
  </tr>`).join('')}</tbody></table>`;
}

load();
</script>
